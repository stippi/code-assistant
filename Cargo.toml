[workspace]
members = ["crates/agent_core", "crates/app_update", "crates/agent_orchestration", "crates/code_assistant", "crates/code_assistant_core", "crates/audio", "crates/ui_acp", "crates/ui_gpui", "crates/ui_terminal", "crates/command_executor", "crates/fs_explorer", "crates/git", "crates/github", "crates/llm", "crates/mcp_client", "crates/mcp_server", "crates/pty_session", "crates/sandbox", "crates/terminal", "crates/terminal_output", "crates/terminal_test_app", "crates/terminal_view", "crates/tools_core", "crates/web"]

resolver = "2"

[patch.crates-io]
crossterm = { git = "https://github.com/nornagon/crossterm", branch = "nornagon/color-query" }
ratatui = { git = "https://github.com/nornagon/ratatui", branch = "nornagon-v0.29.0-patch" }
# gpui-kit 0.7.3 with SelectionFormat::SourceAcrossStyles (copy a selection
# within one style as plain text, see crates/ui_gpui/src/blocks/mod.rs). The
# fork branch `text/plain-copy-within-style-0.7.3` is the v0.7.3 tag plus the
# commit proposed upstream from `text/plain-copy-within-style`, so its
# gpui-base is version 0.7.3 and satisfies gpui-kit's requirement. Drop this
# entry once a gpui-kit release carries the change.
gpui-base = { git = "https://github.com/stippi/gpui-component", rev = "91f6ced13219ed88e9a98c650e3b793891f27571" }
