[workspace]
members = ["crates/agent_core", "crates/agent_orchestration", "crates/code_assistant", "crates/code_assistant_core", "crates/ui_acp", "crates/ui_gpui", "crates/ui_terminal", "crates/command_executor", "crates/fs_explorer", "crates/git", "crates/llm", "crates/mcp_client", "crates/mcp_server", "crates/pty_session", "crates/sandbox", "crates/terminal", "crates/terminal_output", "crates/terminal_test_app", "crates/terminal_view", "crates/tools_core", "crates/web"]

resolver = "2"

[patch.crates-io]
# Fork adding structure-aware DOCX -> Markdown conversion (headings, bullet vs
# ordered lists, tables) plus real page-count reporting. Upstream (v0.3.4) only
# extracts plain run text and stubs tables as "[Table content]".
# Branch: feat/docx-structure (PR pending upstream).
transmutation = { git = "https://github.com/stippi/transmutation", rev = "87f48d18ce3ff61659d7182c1b733eae8ec6f2c9" }
crossterm = { git = "https://github.com/nornagon/crossterm", branch = "nornagon/color-query" }
ratatui = { git = "https://github.com/nornagon/ratatui", branch = "nornagon-v0.29.0-patch" }
# gpui-kit 0.6.6 with longbridge/gpui-kit#3180 (InlineFlow keeps its fragment
# states and layouts across frames; see docs/frame-profiling.md). The fork
# branch `perf/inline-flow-frame-cache-0.6.6` is the v0.6.6 tag plus the PR's
# commits as merged (including the maintainer's follow-up that releases the
# states of fragments that went away), so its gpui-base is version 0.6.6 and
# satisfies gpui-kit's requirement; gpui-component 0.6.6 from crates.io
# resolves to this one copy. Drop this entry once a gpui-kit release carries
# the PR (merged 2026-09-22, after 0.6.6).
gpui-base = { git = "https://github.com/stippi/gpui-component", rev = "887d0d839c32491c44a81826fc401005b8a6f6a5" }
