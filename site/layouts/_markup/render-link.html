{{- $dest := .Destination -}}
{{- $u := urls.Parse $dest -}}
{{- if and (not $u.IsAbs) (hasPrefix $dest "/") -}}{{- $dest = relURL (strings.TrimPrefix "/" $dest) -}}{{- end -}}
<a href="{{ $dest | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $u.IsAbs }} rel="noopener"{{ end }}>{{ .Text }}</a>
{{- /* chomp */ -}}
