[package]
name = "ui_gpui"
version = "0.2.17"
edition = "2024"

[dependencies]
code_assistant_core = { path = "../code_assistant_core", default-features = false }
agent_core = { path = "../agent_core" }
command_executor = { path = "../command_executor" }
git = { path = "../git" }
llm = { path = "../llm" }
sandbox = { path = "../sandbox" }
terminal = { path = "../terminal" }
terminal_view = { path = "../terminal_view" }
tools_core = { path = "../tools_core" }

# GPUI related. gpui-kit pins the matching gpui-pre snapshot and enables the
# platform backends (font-kit, x11, wayland) itself. `profiler` is what
# shared::frame_profile reads gpui's frame timings through.
gpui-kit = { version = "0.6.6", features = ["tree-sitter-languages", "profiler"] }
rust-embed = { version = "8.9", features = ["include-exclude"] }

tokio = { version = "1.48", features = ["full"] }
futures = "0.3"
async-channel = "2.5.0"
async-trait = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

anyhow = "1.0"
tracing = "0.1"
dirs = "5.0"
open = "5"

# Diff visualization
similar = { version = "2.7.0", features = ["unicode"] }

# Image handling (pasted/attached images)
image = "0.25"
base64 = "0.22"

[dev-dependencies]
gpui-kit = { version = "0.6.6", features = ["test-support"] }
tempfile = "3.23"
