[package]
name = "git"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
process_env = { path = "../process_env" }
anyhow = "1.0.95"
notify = { version = "7", features = ["macos_fsevent"] }
serde = { version = "1.0.215", features = ["derive"] }
tokio = { version = "1.40.0", features = ["fs", "process", "time"] }
tracing = "0.1.40"

[dependencies.gix]
version = "0.83.0"
default-features = false
features = ["max-performance", "revision", "sha1", "sha256", "worktree-mutation"]


[dev-dependencies]
tempfile = "3.13.0"
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread", "process"] }
