[package]
name = "llm"
version = "0.2.18"
edition = "2024"
license = "MIT"

[features]
default = ["tls-native-roots"]
## Use the OS-native root CA certificates (macOS Keychain, Windows cert store, etc.).
## HTTPS requests verify through the platform verifier, WebSockets load the
## native roots.
tls-native-roots = ["tokio-tungstenite/rustls-tls-native-roots"]
## Use embedded Mozilla root CA certificates (works on all platforms incl. iOS)
## for HTTPS requests and WebSockets. When both features are on, the native
## roots win for HTTPS requests.
tls-webpki-roots = ["tokio-tungstenite/rustls-tls-webpki-roots", "dep:webpki-root-certs"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# rustls (aws-lc-rs) is always on, the TLS features above only pick the roots.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "query",
    "stream",
] }
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"
tracing = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
dirs = "6.0"
clap = { version = "4.5", features = ["derive"] }
urlencoding = "2.1"
rand = "0.9"
tokio-tungstenite = "0.28"
futures-util = "0.3"
sha2 = "0.11.0"
webpki-root-certs = { version = "1.0", optional = true }

[dev-dependencies]
axum = "0.7"
bytes = "1.10"
temp-env = "0.3"
tempfile = "3.23"
