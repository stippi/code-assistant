[package]
name = "web"
version = "0.2.18"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chromiumoxide = "0.9"
futures = "0.3"
htmd = "0.1.6"
image = "0.25"
percent-encoding = "2.3"
rand = "0.9"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "stream",
] }
scraper = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.7"
