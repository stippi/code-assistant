<!DOCTYPE html>
<!-- Trimmed from the bot check html.duckduckgo.com serves (with HTTP 202)
     to repeated requests (2026-10): no results, a challenge form instead. -->
<html lang="en-US">
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <title>DuckDuckGo</title>
</head>
<body>
  <div class="anomaly-modal__mask">
    <div class="anomaly-modal__modal" data-testid="anomaly-modal">
      <form id="challenge-form" action="//duckduckgo.com/anomaly.js?sv=html&cc=botnet&q=rust programming" method="POST">
        <div class="anomaly-modal__title">Unfortunately, bots use DuckDuckGo too.</div>
        <div class="anomaly-modal__images">
          <div class="anomaly-modal__box">
            <input class="anomaly-modal__check" type="checkbox" name="image-check_0">
          </div>
        </div>
        <div class="anomaly-modal__controls">
          <button class="anomaly-modal__submit" type="submit">Submit</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
