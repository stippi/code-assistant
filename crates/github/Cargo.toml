[package]
name = "github"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
## The scripted `FakeTransport` and `StaticTokenSource` users of the client
## test against.
test-utils = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
lru = "0.19"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "charset",
    "http2",
    "system-proxy",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["process", "sync", "time"] }
tracing = "0.1"
urlencoding = "2.1"
base64 = "0.22"

[dev-dependencies]
github = { path = ".", features = ["test-utils"] }
tokio = { version = "1.48", features = ["full", "test-util"] }
